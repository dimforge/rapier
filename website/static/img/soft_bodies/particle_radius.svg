  <title>Particle radius and surface thickness</title>
  <desc>The particle radius is the contact skin of the surface collider. Much smaller than the distance between two neighboring particles, a thin or fast object slips through the surface; about half that distance is what the constructors pick; larger than that distance, the skins of two parts of a folded surface overlap and the body collides with itself at rest.</desc>
