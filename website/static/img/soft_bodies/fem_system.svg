  <title>Finite elements: one global system</title>
  <desc>Left: a mesh of cells with numbered mass points. Right: the global linear system assembled from all the cells at once; a block is non-zero when two mass points share a cell. The FEM solver solves this whole system each substep instead of correcting the cells one by one.</desc>
