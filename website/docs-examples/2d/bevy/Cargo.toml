[package]
name = "rapier_snippets_bevy2d"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# The in-development bevy_rapier tracks Bevy's main branch.
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main" }
# Use the bevy_rapier checkout next to the rapier repository so doc snippets are checked against local changes.
bevy_rapier2d = { path = "../../../../../bevy_rapier/bevy_rapier2d", features = ["fem", "serde-serialize"] }
# Used For serialization
bincode = { version = "2.0.1", features = ["serde"] }

# Standalone workspace, excluded from the one of the other snippets (see `docs-examples/Cargo.toml`).
[workspace]

# Make bevy_rapier use the in-tree rapier too, so the bevy and rust snippets share the same rapier.
[patch.crates-io]
rapier2d = { path = "../../../../crates/rapier2d" }
