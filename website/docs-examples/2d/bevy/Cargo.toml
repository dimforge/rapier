[package]
name = "rapier_snippets_bevy2d"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = "0.20"
# Use the in-tree bevy_rapier so doc snippets are checked against local changes.
bevy_rapier2d = { path = "../../../../bindings/bevy_rapier/bevy_rapier2d", features = ["fem", "serde-serialize"] }
# Used For serialization
bincode = { version = "2.0.1", features = ["serde"] }

# Standalone workspace, excluded from the one of the other snippets (see `docs-examples/Cargo.toml`).
[workspace]
