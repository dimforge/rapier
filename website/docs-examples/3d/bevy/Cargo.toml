[package]
name = "rapier_snippets_bevy3d"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# The in-development bevy_rapier tracks Bevy's main branch.
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main" }
# Use the in-tree bevy_rapier so doc snippets are checked against local changes.
bevy_rapier3d = { path = "../../../../bindings/bevy_rapier/bevy_rapier3d", features = ["fem", "urdf", "mjcf", "meshloader"] }

# Standalone workspace, excluded from the one of the other snippets (see `docs-examples/Cargo.toml`).
[workspace]
