[package]
name = "rapier2d-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "C ABI for rapier2d"
publish = false
build = "../build.rs"

[lib]
name = "rapier2d_ffi"
path = "../src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["dim2", "f32"]
dim2 = []
f32 = []
parallel = ["rapier/parallel"]
profiler = ["rapier/profiler"]
simd8 = ["rapier/simd8"]
enhanced-determinism = ["rapier/enhanced-determinism"]
fem = ["rapier/fem"]

[dependencies]
rapier-c-macros = { path = "../rapier-c-macros" }
rapier = { package = "rapier2d", path = "../../../crates/rapier2d", features = ["serde-serialize", "debug-render"] }
bincode.workspace = true
serde.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("dim2", "dim3", "f32", "f64", "robotics"))'] }

[[example]]
name = "compare_steps"
path = "../examples/compare_steps.rs"
