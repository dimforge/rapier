language = "C"
include_guard = "RAPIER_H"
cpp_compat = true
usize_is_size_t = true
style = "both"
documentation_style = "doxy"
autogen_warning = "/* Generated by cbindgen. Regenerate with bindings/c/tools/generate-header.sh. */"
header = """
/** @file
 * Rapier C ABI. Select dimension and precision before including this file.
 * Select one variant per translation unit; flags must match its linked library.
 * Read README.md for ownership, pointer lifetime, callbacks and threading. */
#if !defined(RAPIER_DIM2) && !defined(RAPIER_DIM3)
#define RAPIER_DIM3
#endif
#if defined(RAPIER_DIM2) && defined(RAPIER_DIM3)
#error Select exactly one Rapier dimension
#endif
#if !defined(RAPIER_F32) && !defined(RAPIER_F64)
#define RAPIER_F32
#endif
#if defined(RAPIER_F32) && defined(RAPIER_F64)
#error Select exactly one Rapier precision
#endif
#if defined(RAPIER_DIM2)
/** Spatial dimension selected by this header. */
#define R2_DIMENSION 2
/** Select an R2/R3 public type name. */
#define RAPIER_TYPE(name) R2##name
/** Select an R2/R3 public constant name. */
#define RAPIER_CONST(name) R2_##name
/** Select an r2/r3 public function name. */
#define RAPIER_FN(name) r2##name
#else
/** Spatial dimension selected by this header. */
#define R3_DIMENSION 3
/** Select an R2/R3 public type name. */
#define RAPIER_TYPE(name) R3##name
/** Select an R2/R3 public constant name. */
#define RAPIER_CONST(name) R3_##name
/** Select an r2/r3 public function name. */
#define RAPIER_FN(name) r3##name
#endif
#if defined(_WIN32)
/** C ABI calling convention. */
#define RAPIER_CALL __cdecl
#else
/** C ABI calling convention. */
#define RAPIER_CALL
#endif
#ifndef RAPIER_API
#if defined(_WIN32) && !defined(RAPIER_STATIC)
/** Shared-library import annotation. */
#define RAPIER_API __declspec(dllimport)
#else
/** Shared-library import annotation. */
#define RAPIER_API
#endif
#endif
"""
[defines]
"feature = dim2" = "RAPIER_DIM2"
"feature = dim3" = "RAPIER_DIM3"
"feature = f32" = "RAPIER_F32"
"feature = f64" = "RAPIER_F64"
"feature = fem" = "RAPIER_FEM"
"feature = parallel" = "RAPIER_PARALLEL"
"feature = robotics" = "RAPIER_ROBOTICS"
[fn]
prefix = "RAPIER_API"
[parse]
parse_deps = false
