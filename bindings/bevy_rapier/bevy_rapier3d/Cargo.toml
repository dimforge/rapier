[package]
name = "bevy_rapier3d"
version = "0.36.0"
authors = ["Sébastien Crozet <developer@crozet.re>"]
description = "3-dimensional physics engine in Rust, official Bevy plugin."
documentation = "http://docs.rs/bevy_rapier3d"
homepage = "http://rapier.rs"
repository = "https://github.com/dimforge/rapier"
readme = "../README.md"
keywords = ["physics", "dynamics", "rigid", "real-time", "joints"]
license = "Apache-2.0"
edition = "2021"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
path = "../src/lib.rs"
required-features = ["dim3"]

[lints]
rust.unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("dim2"))',
] }
clippy = { needless_lifetimes = "allow" }

[features]
default = [
    "dim3",
    "async-collider",
    "debug-render-3d",
    "picking-backend",
    "to-bevy-mesh",
]
dim3 = []
# Alias of the debug-render feature matching this crate's dimension.
debug-render = ["debug-render-3d"]
debug-render-2d = [
    "bevy/bevy_core_pipeline",
    "bevy/bevy_sprite",
    "bevy/bevy_gizmos",
    "rapier3d/debug-render",
    "bevy/bevy_asset",
]
debug-render-3d = [
    "bevy/bevy_core_pipeline",
    "bevy/bevy_pbr",
    "bevy/bevy_gizmos",
    "rapier3d/debug-render",
    "bevy/bevy_asset",
]
rapier-debug-render = ["rapier3d/debug-render"]

parallel = ["rapier3d/parallel"]
simd8 = ["rapier3d/simd8"]
serde-serialize = ["rapier3d/serde-serialize", "bevy/serialize", "serde"]
enhanced-determinism = ["rapier3d/enhanced-determinism"]
# Couples the two normal constraints of a contact pair into a single 2x2 block solve.
block-solver = ["rapier3d/block-solver"]
# Enables Rapier's internal profiler, needed for the timings reported by `RapierDiagnosticsPlugin`.
profiler = ["rapier3d/profiler"]
# Drops the `Sync` requirement of Rapier's callbacks (this also removes the dedicated thread-pool
# support enabled by `parallel`).
unsync-callbacks = ["rapier3d/unsync-callbacks"]
# Opt-in bounds checks on the solver's unchecked SIMD gathers (for debugging).
solver-bounds-checks = ["rapier3d/solver-bounds-checks"]
# Enables the experimental FEM soft-body solver.
fem = ["rapier3d/fem"]
picking-backend = ["bevy/bevy_picking", "bevy/bevy_render"]
async-collider = [
    "bevy/bevy_asset",
    "bevy/bevy_world_serialization",
    "bevy/bevy_render",
    "bevy/bevy_image",
]
to-bevy-mesh = ["bevy/bevy_render", "bevy/bevy_asset"]
# Spawns URDF robots as entities (see `bevy_rapier3d::loaders::urdf`). STL, Collada and OBJ
# meshes referenced by the URDF files are loaded too.
urdf = ["dep:rapier3d-urdf", "rapier3d-urdf/stl", "rapier3d-urdf/collada", "rapier3d-urdf/wavefront"]
# Spawns MuJoCo MJCF models as entities (see `bevy_rapier3d::loaders::mjcf`). STL and OBJ
# meshes referenced by the MJCF files are loaded too.
mjcf = ["dep:rapier3d-mjcf", "rapier3d-mjcf/stl", "rapier3d-mjcf/wavefront"]
# Builds colliders from STL, Collada and OBJ files (see `bevy_rapier3d::loaders::meshloader`).
meshloader = [
    "dep:rapier3d-meshloader",
    "rapier3d-meshloader/stl",
    "rapier3d-meshloader/collada",
    "rapier3d-meshloader/wavefront",
]

[dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = ["std"] }
nalgebra = { version = "0.35", features = ["convert-glam033"] }
rapier3d = { workspace = true }
rapier3d-urdf = { workspace = true, optional = true }
rapier3d-mjcf = { workspace = true, optional = true }
rapier3d-meshloader = { workspace = true, optional = true }
bitflags = "2.10.0"
log = "0.4"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = false, features = [
    "bevy_window",
    "x11",
    "tonemapping_luts",
    "zstd_rust",
    "bevy_state",
    "bevy_debug_stepping",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "bevy_log",
    "bevy_gizmos_render",
] }
approx = "0.5.1"
glam = { version = "0.33", features = ["approx"] }
serde_json = "1.0"

[package.metadata.docs.rs]
# Enable all the features when building the docs on docs.rs
features = ["debug-render-3d", "serde-serialize", "async-collider", "urdf", "mjcf", "meshloader"]

[package.metadata.cargo-all-features]

# `enhanced-determinism` enables `glam/scalar-math` (through parry), which removes the serde
# impls of `glam::BVec3A`/`BVec4A` that `bevy_reflect` requires unconditionally.
denylist = ["enhanced-determinism"]

# Features "dim2" and "dim3" are incompatible, so skip permutations including them
skip_feature_sets = [["enhanced-determinism", "simd8"]]

always_include_features = ["dim3"]

# The maximum number of features to try at once. Does not count features from `always_include_features`.
# This is useful for reducing the number of combinations run for a crate with a large amount of features,
# since in most cases a bug just needs a small set of 2-3 features to reproduce.

max_combination_size = 1
[[example]]
name = "urdf3"
required-features = ["urdf"]

[[example]]
name = "mjcf3"
required-features = ["mjcf"]

[[example]]
name = "picking3"
required-features = ["picking-backend"]

[[example]]
name = "testbed3"
required-features = ["picking-backend"]

[[example]]
name = "soft_fem3"
required-features = ["fem"]
